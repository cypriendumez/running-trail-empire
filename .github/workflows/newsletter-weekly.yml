# ─────────────────────────────────────────────────────────────────────────────
#  RÉSUMÉ HEBDOMADAIRE DE L'ACTUALITÉ — tous les lundis matin.
#
#  POURQUOI ICI ET PAS DANS vercel.json : même raison que la synchronisation du coach.
#  Le compte Vercel est en plan HOBBY, qui plafonne les tâches planifiées à UNE par jour
#  — or ce créneau est déjà pris. GitHub Actions n'a pas cette limite.
#
#  HORAIRE : 6 h 30 UTC. En heure de Paris cela donne 8 h 30 l'été (CEST) et 7 h 30
#  l'hiver (CET) — GitHub ne connaît que l'UTC, il n'y a pas de « 8 h 30 toute l'année ».
#  Le décalage d'une heure entre saisons est assumé : sur un e-mail hebdomadaire il ne
#  change rien, et une bascule automatique demanderait deux planifications concurrentes.
#
#  UNE LIMITE DE GITHUB, MESURÉE et pas seulement redoutée : le lundi 31/08/2026, la
#  planification de 6 h 30 UTC a réellement tiré à 14 h 18 UTC — SEPT HEURES ET DEMIE
#  de retard (le 24/08 : 7 h 38, une heure). La garantie n'est donc pas « lundi matin »
#  mais « lundi, un jour ». Conséquence directe traitée plus bas : passé 23 h 59 UTC la
#  route refuse de s'exécuter, et elle refuse en répondant 200.
#  Et un dépôt sans activité pendant 60 jours voit ses planifications désactivées.
#
#  CE QUE FAIT LA ROUTE APPELÉE :
#   • elle n'envoie qu'aux abonnés `unsubscribed = false`, jamais aux simples comptes ;
#   • elle N'ENVOIE RIEN si la semaine compte moins de 5 articles — un e-mail creux
#     coûte des désinscriptions, il ne rapporte rien ;
#   • chaque message porte son lien de désinscription et les en-têtes List-Unsubscribe.
#
#  SECRETS REQUIS (Settings → Secrets and variables → Actions) — les MÊMES que le
#  workflow de synchronisation, rien à créer si celui-ci fonctionne déjà :
#   • PACEVO_URL   = https://running-trail-empire-woad.vercel.app
#   • CRON_SECRET  = la MÊME valeur que la variable CRON_SECRET sur Vercel
# ─────────────────────────────────────────────────────────────────────────────
name: Résumé hebdomadaire de l'actualité

on:
  schedule:
    - cron: "30 6 * * 1"
  # Indispensable pour vérifier la chaîne sans attendre lundi.
  workflow_dispatch:

# Deux passages ne doivent jamais se chevaucher : ils enverraient l'e-mail en double.
concurrency:
  group: newsletter-weekly
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Envoyer le résumé
        env:
          PACEVO_URL: ${{ secrets.PACEVO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PACEVO_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::PACEVO_URL ou CRON_SECRET manquant dans les secrets du dépôt."
            exit 1
          fi
          reponse=$(curl -sS --max-time 120 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PACEVO_URL}/api/newsletter/weekly")
          corps=$(printf '%s' "$reponse" | sed '$d')
          code=$(printf '%s' "$reponse" | tail -n1)
          echo "HTTP ${code}"
          echo "${corps}"
          # Un « 0 envoyé » n'est PAS une erreur : c'est le comportement voulu quand la
          # semaine est pauvre en actualité ou qu'il n'y a pas encore d'abonné.
          if [ "${code}" != "200" ]; then
            echo "::error::L'envoi a échoué (HTTP ${code})."
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────────
      #  LE PLAN DE LA SEMAINE — une étape À PART, ajoutée après le résumé.
      #
      #  ⚠️ CETTE ÉTAPE A DÉJÀ CASSÉ LE WORKFLOW UNE FOIS, le 24/08/2026. Elle avait
      #  été insérée juste après la ligne du `curl` du résumé — c'est-à-dire AU MILIEU
      #  du script `run:` de l'étape précédente. Le reste de ce script (lecture du code
      #  HTTP, vérification du 200) s'est retrouvé rattaché à CETTE étape, où la variable
      #  `$reponse` n'existe pas : le code lu était vide, la comparaison à « 200 »
      #  échouait, et le job entier tombait en 44 secondes — après avoir tout de même
      #  envoyé les deux e-mails. Un échec bruyant sur un travail réussi.
      #
      #  Une étape s'ajoute À LA FIN de la liste, jamais au milieu d'un bloc `run:`.
      #
      #  `if: always()` : le résumé d'actualité dépend de Gemini et d'un flux RSS. S'il
      #  tombe, l'athlète doit quand même recevoir sa semaine — les deux n'ont aucun
      #  rapport.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Envoyer le plan de la semaine
        if: always()
        env:
          PACEVO_URL: ${{ secrets.PACEVO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # ⚠️ TROIS TENTATIVES, PARCE QUE CE COURRIEL N'A QU'UNE CHANCE PAR SEMAINE.
          #    Échec constaté le 31/08/2026 sur cette étape. Rejouée le 02/09 en essai à
          #    blanc, la même route répond 200 en 2,1 s : la panne était passagère
          #    (démarrage à froid, 5xx de plateforme). Sans reprise, un hoquet de quelques
          #    secondes prive tous les athlètes du plan de la semaine — et la prochaine
          #    occasion est sept jours plus tard.
          code=""
          for essai in 1 2 3; do
            reponse=$(curl -sS --max-time 120 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${PACEVO_URL}/api/cron/plan-semaine" || true)
            corps=$(printf '%s' "$reponse" | sed '$d')
            code=$(printf '%s' "$reponse" | tail -n1)
            echo "tentative ${essai} → HTTP ${code}"
            echo "${corps}"
            [ "${code}" = "200" ] && break
            [ "${essai}" -lt 3 ] && sleep 30
          done
          if [ "${code}" != "200" ]; then
            echo "::error::L'envoi du plan de la semaine a échoué trois fois (dernier code ${code})."
            exit 1
          fi
          # ⚠️ UN 200 NE PROUVE PAS QU'ON A ENVOYÉ QUELQUE CHOSE.
          #    La route refuse de tourner si, à l'instant où elle est appelée, l'UTC
          #    n'est plus lundi — et elle refuse poliment, par `{"skipped":"..."} ` en
          #    HTTP 200. Or GitHub a déjà décalé cette planification de sept heures et
          #    demie (31/08/2026). Un décalage de plus de 17 h 30 la ferait basculer au
          #    mardi : zéro courriel parti, workflow AU VERT, et personne pour s'en
          #    apercevoir avant que les athlètes ne se plaignent. On le rend bruyant.
          if printf '%s' "${corps}" | grep -q '"skipped"'; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Le plan de la semaine n'a été envoyé à PERSONNE : la route a refusé (${corps})."
              exit 1
            fi
            echo "::warning::Route ignorée (normal hors lundi lors d'un lancement manuel) : ${corps}"
          fi
